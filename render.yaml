# Render Blueprint: one web service from the Dockerfile, with a disk for projects (videos, voices, exports).
# Secrets are asked for when you create the Blueprint (sync: false), never stored here. The site is open;
# add an APP_PASSWORD variable in Render to put it behind a password (see src/lib/auth.ts).
services:
  - type: web
    name: cleartake
    runtime: docker
    plan: 1c-2g # exports run a headless browser; 512 MB isn't enough
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 5
